name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    # Every platform must reproduce src/test/resources/determinism/golden.txt bit for bit
    # (CrossPlatformDeterminismTest). The experimental profile compiles the Vector API paths, whose
    # results must not depend on the vector width (NEON 128-bit on arm64, AVX2/AVX-512 on x86_64).
    name: Verify (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        profile: [default, experimental]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show platform
        run: |
          uname -m
          java -version

      # Maven Central downloads occasionally time out on the hosted runners (seen on ubuntu-latest). A run that fails
      # while resolving dependencies or plugins is retried with -U (bypassing cached "absent" markers) and longer
      # transport retries; a run that fails for any other reason (tests, Checkstyle, SpotBugs) fails at once.
      - name: Verify (tests, Checkstyle, SpotBugs, coverage gate)
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          args="-B clean verify"
          [ "$PROFILE" = "experimental" ] && args="$args -Pexperimental"
          retry="-Daether.connector.http.retryHandler.count=5 -Daether.transport.http.retryHandler.count=5"
          for attempt in 1 2 3; do
            if mvn $args $retry $( [ $attempt -gt 1 ] && echo -U ) 2>&1 | tee build.log; [ "${PIPESTATUS[0]}" = "0" ]; then
              exit 0
            fi
            if ! grep -qE "Could not (transfer|resolve|find artifact)|could not be resolved|Connection (reset|timed out)" build.log; then
              exit 1
            fi
            echo "::warning::dependency download failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-${{ matrix.profile }}
          path: target/surefire-reports

  examples:
    # The examples are a separate project (examples/pom.xml) built against this commit's library: install it to
    # the runner's local repository, then compile the examples and run their tests.
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install the library
        run: mvn -B -q install -DskipTests -Dcheckstyle.skip -Dspotbugs.skip -Djacoco.skip -Dmaven.javadoc.skip

      - name: Build and test the examples
        run: mvn -B -f examples/pom.xml verify

      - name: Run every example
        run: java -p examples/target/lib:examples/target/vectrix-examples.jar -m org.dynamisengine.vectrix.examples all

  gpu-kernels:
    # vectrix-gpu (vectrix-gpu/pom.xml) is a separate project built against this commit's library. DynamisGPU is
    # not on Maven Central, so its release's Maven repository is unpacked into the runner's local repository. The
    # runners have no GPU: the kernels run on the reference backend here, and on Metal and Vulkan before a release.
    name: GPU kernels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DYNAMISGPU_VERSION: "1.0.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install the library
        run: mvn -B -q install -DskipTests -Dcheckstyle.skip -Dspotbugs.skip -Djacoco.skip -Dmaven.javadoc.skip

      - name: Install DynamisGPU from its GitHub Release
        run: |
          curl -fsSL -o dynamisgpu.zip \
            "https://github.com/ljramones/DynamicGPU/releases/download/v${DYNAMISGPU_VERSION}/dynamisgpu-${DYNAMISGPU_VERSION}-maven.zip"
          unzip -q dynamisgpu.zip -d dynamisgpu
          mkdir -p ~/.m2/repository
          cp -R dynamisgpu/dynamisgpu-${DYNAMISGPU_VERSION}/repository/. ~/.m2/repository/

      - name: Build and test vectrix-gpu
        run: mvn -B -f vectrix-gpu/pom.xml verify

  bench-smoke:
    name: JMH Smoke (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build benchmark uber-jar
        run: mvn -B -q clean package -Pbench -DskipTests

      - name: Run benchmark smoke suite
        run: |
          java --add-modules jdk.incubator.vector -jar target/benchmarks.jar ".*(TransformComposeBenchmark|Affine4fBenchmark|FrustumCullingBenchmark|GpuPackingBenchmark|QuatCompressionBenchmark|GpuLayoutBenchmark|SkinningKernelBenchmark|MeshMathBenchmark|ReductionBenchmark).*" \
            -f 1 -wi 1 -i 1 -w 150ms -r 150ms -t 1 \
            -rf csv -rff target/jmh-smoke.csv

      - name: Benchmark regression check (if baseline exists)
        run: |
          if [ -f benchmarks/baselines/ci-jdk25-smoke.csv ]; then
            ./scripts/bench-compare.sh benchmarks/baselines/ci-jdk25-smoke.csv target/jmh-smoke.csv 12 20 20
          else
            echo "No CI baseline found at benchmarks/baselines/ci-jdk25-smoke.csv; skipping regression gate."
          fi

      - name: Upload JMH smoke result
        uses: actions/upload-artifact@v4
        with:
          name: jmh-smoke-csv
          path: target/jmh-smoke.csv
