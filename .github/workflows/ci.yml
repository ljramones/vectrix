name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    # Every platform must reproduce src/test/resources/determinism/golden.txt bit for bit
    # (CrossPlatformDeterminismTest). The experimental profile compiles the Vector API paths, whose
    # results must not depend on the vector width (NEON 128-bit on arm64, AVX2/AVX-512 on x86_64).
    name: Verify (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        profile: [default, experimental]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show platform
        run: |
          uname -m
          java -version

      # gpg.skip: the published dynamis-parent 1.0.0 binds GPG signing to verify (later moved into the release
      # profile, not yet republished); CI has no signing key and does not deploy.
      - name: Verify (tests, Checkstyle, SpotBugs, coverage gate)
        run: |
          if [ "${{ matrix.profile }}" = "experimental" ]; then
            mvn -B clean verify -Pexperimental -Dgpg.skip=true
          else
            mvn -B clean verify -Dgpg.skip=true
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-${{ matrix.profile }}
          path: target/surefire-reports

  bench-smoke:
    name: JMH Smoke (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build benchmark uber-jar
        run: mvn -B -q clean package -Pbench -DskipTests

      - name: Run benchmark smoke suite
        run: |
          java --add-modules jdk.incubator.vector -jar target/benchmarks.jar ".*(TransformComposeBenchmark|Affine4fBenchmark|FrustumCullingBenchmark|GpuPackingBenchmark|QuatCompressionBenchmark|GpuLayoutBenchmark|SkinningKernelBenchmark|MeshMathBenchmark|StdLayoutBenchmark|ReductionBenchmark).*" \
            -f 1 -wi 1 -i 1 -w 150ms -r 150ms -t 1 \
            -rf csv -rff target/jmh-smoke.csv

      - name: Benchmark regression check (if baseline exists)
        run: |
          if [ -f benchmarks/baselines/ci-jdk25-smoke.csv ]; then
            ./scripts/bench-compare.sh benchmarks/baselines/ci-jdk25-smoke.csv target/jmh-smoke.csv 12 20 20
          else
            echo "No CI baseline found at benchmarks/baselines/ci-jdk25-smoke.csv; skipping regression gate."
          fi

      - name: Upload JMH smoke result
        uses: actions/upload-artifact@v4
        with:
          name: jmh-smoke-csv
          path: target/jmh-smoke.csv
